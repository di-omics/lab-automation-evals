[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab-automation-evals"
version = "0.1.0"
description = "Lab automation evaluation tasks for AI agents: plans graded by executing them on a simulated liquid handler, each task shipped with scripted controls."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lae = "lab_automation_evals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_automation_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
